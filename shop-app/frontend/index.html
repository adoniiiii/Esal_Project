<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Docker Shop</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .product { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
    button { padding: 8px 15px; background: #0E4C92; color: white; border: none; cursor: pointer; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Docker Shop</h1>
  <div id="products">Loading products...</div>
  <h2>Cart</h2>
  <div id="cart">Loading cart...</div>

  <script>
    const API = "http://localhost:5000";

    function loadProducts() {
      fetch(API + "/products")
        .then(res => res.json())
        .then(data => {
          let html = "";
          data.forEach(p => {
            html += '<div class="product"><h3>' + p.name + ' - $' + p.price + '</h3><button onclick="addToCart(' + p.id + ')">Add to cart</button></div>';
          });
          document.getElementById("products").innerHTML = html;
        })
        .catch(err => {
          document.getElementById("products").innerHTML = "Error loading products from Backend!";
        });
    }

    function addToCart(id) {
      fetch(API + "/cart/add/" + id, { method: "POST" })
        .then(() => loadCart());
    }

    function loadCart() {
      fetch(API + "/cart")
        .then(res => res.json())
        .then(cart => {
          document.getElementById("cart").innerHTML = "Items: " + cart.count + ", Total: $" + cart.total;
        })
        .catch(err => {
          document.getElementById("cart").innerHTML = "Cart is empty";
        });
    }

    loadProducts();
    loadCart();
  </script>
</body>
</html>
